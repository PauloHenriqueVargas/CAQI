name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  java:
    name: Java — build & test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build (compile + test)
        run: ./gradlew build --scan
        env:
          # Testcontainers usa o socket Docker do runner Ubuntu
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            apps/*/build/reports/tests/**
            apps/*/build/test-results/**

  # ──────────────────────────────────────────────────────────────────────
  web:
    name: Web — lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci --no-audit --prefer-offline || npm install --no-audit
        # fallback para `npm install` enquanto o lockfile não está commitado

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          CAQ_ENGINE_URL: http://localhost:8081
          CAQ_FINANCEIRO_URL: http://localhost:8082
          CAQ_ESCOLAR_URL: http://localhost:8083
          CAQ_COMPLIANCE_URL: http://localhost:8084
          NEXTAUTH_SECRET: ci_dummy_secret_not_for_production_use_only
          NEXTAUTH_URL: http://localhost:3000

  # ──────────────────────────────────────────────────────────────────────
  web-e2e:
    name: Web — E2E + WCAG (Playwright + axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: web
    defaults:
      run:
        working-directory: apps/web
    env:
      CAQ_ENGINE_URL: http://127.0.0.1:9991
      CAQ_FINANCEIRO_URL: http://127.0.0.1:9992
      CAQ_ESCOLAR_URL: http://127.0.0.1:9993
      CAQ_COMPLIANCE_URL: http://127.0.0.1:9994
      NEXTAUTH_SECRET: ci_dummy_secret_not_for_production_use_only
      NEXTAUTH_URL: http://127.0.0.1:3000
      CAQI_MUNICIPIO_NOME: Município E2E
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci --no-audit --prefer-offline || npm install --no-audit

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}

      - name: Install Playwright (Chromium + deps)
        run: npx playwright install --with-deps chromium

      - name: Build (Next.js)
        run: npm run build

      - name: Run E2E + axe-core
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────
  helm:
    name: Helm — lint & template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.1

      - name: Lint chart
        run: helm lint charts/caqi

      - name: Template (default values)
        run: helm template caqi-test charts/caqi --debug

      - name: Template (município exemplo)
        run: helm template caqi-municipio-exemplo charts/caqi -f charts/caqi/values-municipio-exemplo.yaml --debug

  # ──────────────────────────────────────────────────────────────────────
  dbt:
    name: dbt — parse + compile (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: caqi
          POSTGRES_USER: caqi
          POSTGRES_PASSWORD: caqi_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caqi -d caqi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: analytics
    env:
      CAQI_DBT_HOST: localhost
      CAQI_DBT_PORT: "5432"
      CAQI_DBT_USER: caqi
      CAQI_DBT_PASSWORD: caqi_test_password
      CAQI_DBT_DB: caqi
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analytics/requirements.txt

      - name: Install dbt
        run: pip install -r requirements.txt

      - name: Apply Flyway migrations (gives dbt sources to validate against)
        run: |
          # Migrações ficam em apps/caq-engine-svc/src/main/resources/db/migration
          # Aqui usamos psql para criar tabelas vazias suficientes para dbt compile.
          # Em prod, dbt rodaria contra um schema já populado pelos serviços Spring.
          PGPASSWORD=caqi_test_password psql -h localhost -U caqi -d caqi \
            -f ../apps/caq-engine-svc/src/main/resources/db/migration/V0001__initial_schema.sql

      - name: Apply later migrations (V0002+)
        run: |
          # Aplica todas as migrações em ordem alfanumérica, exceto V0001 (já aplicada acima).
          for f in $(ls ../apps/caq-engine-svc/src/main/resources/db/migration/V*.sql | sort); do
            base=$(basename "$f")
            case "$base" in V0001*) continue;; esac
            echo "Applying $base"
            PGPASSWORD=caqi_test_password psql -h localhost -U caqi -d caqi -f "$f"
          done

      - name: Generate profiles.yml from template
        run: |
          mkdir -p ~/.dbt
          cp profiles.example.yml ~/.dbt/profiles.yml

      - name: dbt deps
        run: dbt deps

      - name: dbt parse (validate sintaxe + refs)
        run: dbt parse

      - name: dbt compile (valida SQL contra schema real)
        run: dbt compile --target dev

      - name: dbt run (sem tests, só valida que SQL roda)
        run: dbt run --target dev --exclude-resource-type test

  # ──────────────────────────────────────────────────────────────────────
  openapi:
    name: OpenAPI — validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@1.25.5

      - name: Validate OpenAPI
        run: redocly lint openapi/caqi-openapi.yaml

  # ──────────────────────────────────────────────────────────────────────
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Verifica LICENSE presente e proprietária
        run: |
          test -f LICENSE
          grep -q "PROPRIETARY AND CONFIDENTIAL" LICENSE
          grep -q "Controller — Consultoria & Assessoria" LICENSE

      - name: Verifica que .env / segredos não foram commitados
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.[^.]*$' | grep -v '\.env\.example' | grep -v '\.env\.local\.example'; then
            echo "ERRO: arquivo .env commitado"; exit 1
          fi

      - name: Verifica que arquivos > 5 MB não foram adicionados (exceto refs)
        run: |
          large=$(git ls-files | xargs -I{} wc -c {} 2>/dev/null | awk '$1 > 5242880 && $2 !~ /^docs\/references\// {print $2 " " $1}')
          if [ -n "$large" ]; then
            echo "ERRO: arquivos > 5 MB fora de docs/references/:"; echo "$large"; exit 1
          fi
