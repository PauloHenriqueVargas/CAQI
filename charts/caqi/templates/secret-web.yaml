{{- /*
NextAuth precisa de um segredo. Em prod, gerencie via External Secrets/Vault.
Aqui geramos um valor aleatório se não existir — não atualizamos releases existentes
para não invalidar sessões ativas (lookup).
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-web" (include "caqi.fullname" .)) -}}
{{- $secret := "" -}}
{{- if $existing -}}
  {{- $secret = index $existing.data "nextauthSecret" | b64dec -}}
{{- else -}}
  {{- $secret = randAlphaNum 64 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "caqi.fullname" . }}-web
  labels:
    {{- include "caqi.labels" . | nindent 4 }}
type: Opaque
data:
  nextauthSecret: {{ $secret | b64enc | quote }}
