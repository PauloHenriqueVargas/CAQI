{{- if .Values.services.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "caqi.fullname" . }}-web
  labels:
    {{- include "caqi.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.services.web.replicas }}
  selector:
    matchLabels:
      {{- include "caqi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "caqi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "caqi.fullname" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}/caqi-web:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - containerPort: {{ .Values.services.web.port }}
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "{{ .Values.services.web.port }}"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: CAQ_ENGINE_URL
              value: "http://{{ include "caqi.fullname" . }}-engine:{{ .Values.services.engine.port }}"
            - name: CAQ_FINANCEIRO_URL
              value: "http://{{ include "caqi.fullname" . }}-financeiro:{{ .Values.services.financeiro.port }}"
            - name: CAQ_ESCOLAR_URL
              value: "http://{{ include "caqi.fullname" . }}-escolar:{{ .Values.services.escolar.port }}"
            - name: CAQ_COMPLIANCE_URL
              value: "http://{{ include "caqi.fullname" . }}-compliance:{{ .Values.services.compliance.port }}"
            - name: CAQI_MUNICIPIO_ID
              value: {{ .Values.tenant.municipioId | quote }}
            - name: CAQI_MUNICIPIO_NOME
              value: {{ .Values.tenant.municipioNome | quote }}
            - name: CAQI_MUNICIPIO_UF
              value: {{ .Values.tenant.uf | quote }}
            - name: NEXTAUTH_URL
              value: "https://{{ (index .Values.ingress.hosts 0).host }}"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "caqi.fullname" . }}-web
                  key: nextauthSecret
            {{- if .Values.auth.govbr.enabled }}
            - name: GOVBR_ISSUER
              value: {{ .Values.auth.govbr.issuer | quote }}
            - name: GOVBR_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.govbr.existingSecret }}
                  key: clientId
            - name: GOVBR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.govbr.existingSecret }}
                  key: clientSecret
            {{- end }}
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml .Values.services.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "caqi.fullname" . }}-web
  labels:
    {{- include "caqi.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.services.web.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "caqi.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
{{- end }}
