{{- if .Values.services.engine.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "caqi.fullname" . }}-engine
  labels:
    {{- include "caqi.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  replicas: {{ .Values.services.engine.replicas }}
  selector:
    matchLabels:
      {{- include "caqi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: engine
  template:
    metadata:
      labels:
        {{- include "caqi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: engine
    spec:
      serviceAccountName: {{ include "caqi.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: engine
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}/caq-engine-svc:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - containerPort: {{ .Values.services.engine.port }}
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SERVER_PORT
              value: "{{ .Values.services.engine.port }}"
            - name: CAQI_MUNICIPIO_ID
              value: {{ .Values.tenant.municipioId | quote }}
            - name: CAQI_MUNICIPIO_NOME
              value: {{ .Values.tenant.municipioNome | quote }}
            - name: CAQI_MUNICIPIO_UF
              value: {{ .Values.tenant.uf | quote }}
            - name: DATABASE_URL
              value: "jdbc:postgresql://{{ .Values.postgresql.external.host }}:{{ .Values.postgresql.external.port }}/{{ .Values.postgresql.external.database }}"
            - name: DATABASE_USER
              value: {{ .Values.postgresql.external.username | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.external.existingSecret }}
                  key: {{ .Values.postgresql.external.existingSecretKey }}
            - name: RABBITMQ_HOST
              value: {{ .Values.rabbitmq.external.host | quote }}
            - name: RABBITMQ_USER
              value: {{ .Values.rabbitmq.external.username | quote }}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbitmq.external.existingSecret }}
                  key: {{ .Values.rabbitmq.external.existingSecretKey }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otelCollector.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: caq-engine-svc
            - name: CAQI_COMPLIANCE_FUNDEB_70
              value: {{ .Values.compliance.enforceFundeb70 | quote }}
            - name: CAQI_COMPLIANCE_VAAT_15
              value: {{ .Values.compliance.enforceVaat15 | quote }}
            - name: CAQI_COMPLIANCE_MDE_25
              value: {{ .Values.compliance.enforceMde25 | quote }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            {{- toYaml .Values.services.engine.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "caqi.fullname" . }}-engine
  labels:
    {{- include "caqi.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.services.engine.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "caqi.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: engine
{{- end }}
