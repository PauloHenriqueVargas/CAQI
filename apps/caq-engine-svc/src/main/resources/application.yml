spring:
  application:
    name: caq-engine-svc
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/caqi}
    username: ${DATABASE_USER:caqi}
    password: ${DATABASE_PASSWORD:caqi_dev_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: public
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:caqi}
    username: ${RABBITMQ_USER:caqi}
    password: ${RABBITMQ_PASSWORD:caqi_dev_password}
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  compression:
    enabled: true
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      service: ${spring.application.name}
      tenant: ${caqi.tenant.municipio-id:000000}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

logging:
  level:
    root: INFO
    br.com.caqi: DEBUG
  pattern:
    correlation: "[${spring.application.name},%X{traceId:-},%X{spanId:-}] "
    level: "%5p ${logging.pattern.correlation}"

caqi:
  tenant:
    municipio-id: ${CAQI_MUNICIPIO_ID:000000}
    municipio-nome: ${CAQI_MUNICIPIO_NOME:Municipio Exemplo}
    uf: ${CAQI_MUNICIPIO_UF:XX}
  compliance:
    enforce-fundeb-70: ${CAQI_COMPLIANCE_FUNDEB_70:true}
    enforce-vaat-15: ${CAQI_COMPLIANCE_VAAT_15:true}
    enforce-mde-25: ${CAQI_COMPLIANCE_MDE_25:true}
