spring:
  jpa:
    show-sql: true
  flyway:
    clean-disabled: false  # apenas em DEV: permite db migrate clean
    locations:
      - classpath:db/migration
      - classpath:db/seed       # carrega V9001+ (golden dataset da planilha)
logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
