spring:
  application:
    name: caq-financeiro-svc
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/caqi}
    username: ${DATABASE_USER:caqi}
    password: ${DATABASE_PASSWORD:caqi_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # default_schema removido — DDL atual está em public; schema-per-service vira em Fase 2 do roadmap
  flyway:
    enabled: false  # Owner do schema é caq-engine-svc no MVP
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:caqi}
    username: ${RABBITMQ_USER:caqi}
    password: ${RABBITMQ_PASSWORD:caqi_dev_password}
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: ${spring.application.name}
      tenant: ${caqi.tenant.municipio-id:000000}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

caqi:
  tenant:
    municipio-id: ${CAQI_MUNICIPIO_ID:000000}
    municipio-nome: ${CAQI_MUNICIPIO_NOME:Municipio Exemplo}
  compliance:
    # Quando true, POST /api/v1/financeiro/despesas é rejeitado (409 Conflict) se a despesa
    # derruba MDE/Fundeb70/VAAT15 de cumpre→não-cumpre. Default false em prod (apenas alerta
    # via notificação no compliance-svc).
    bloquear-empenhos-violadores: ${CAQI_BLOQUEAR_EMPENHOS_VIOLADORES:false}
  security:
    users:
      leitor:
        username: ${CAQI_LEITOR_USERNAME:leitor}
        password: ${CAQI_LEITOR_PASSWORD:trocar_em_prod}
      gestor:
        username: ${CAQI_GESTOR_USERNAME:gestor}
        password: ${CAQI_GESTOR_PASSWORD:trocar_em_prod}
      admin:
        username: ${CAQI_ADMIN_USERNAME:admin}
        password: ${CAQI_ADMIN_PASSWORD:trocar_em_prod}
