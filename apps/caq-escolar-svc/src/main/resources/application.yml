spring:
  application:
    name: caq-escolar-svc
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/caqi}
    username: ${DATABASE_USER:caqi}
    password: ${DATABASE_PASSWORD:caqi_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 200MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:caqi}
    username: ${RABBITMQ_USER:caqi}
    password: ${RABBITMQ_PASSWORD:caqi_dev_password}
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: ${spring.application.name}
      tenant: ${caqi.tenant.municipio-id:000000}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

caqi:
  tenant:
    municipio-id: ${CAQI_MUNICIPIO_ID:000000}
    municipio-nome: ${CAQI_MUNICIPIO_NOME:Municipio Exemplo}
    # Código IBGE 7-dígitos do município, usado para filtrar Censo INEP por
    # CO_MUNICIPIO. Ex.: Palmas/TO = 1721000, São Paulo/SP = 3550308.
    cod-municipio-ibge: ${CAQI_COD_MUNICIPIO_IBGE:0000000}
  censo:
    # Limite por arquivo de Censo (em bytes). INEP publica ESCOLAS.csv
    # tipicamente 30-80MB para o Brasil inteiro; deixamos margem.
    max-file-size-bytes: ${CAQI_CENSO_MAX_FILE_SIZE_BYTES:209715200}
  security:
    users:
      # MVP — substituir por Gov.br OAuth2 + DB user store em produção
      leitor:
        username: ${CAQI_LEITOR_USERNAME:leitor}
        password: ${CAQI_LEITOR_PASSWORD:trocar_em_prod}
      gestor:
        username: ${CAQI_GESTOR_USERNAME:gestor}
        password: ${CAQI_GESTOR_PASSWORD:trocar_em_prod}
      admin:
        username: ${CAQI_ADMIN_USERNAME:admin}
        password: ${CAQI_ADMIN_PASSWORD:trocar_em_prod}
